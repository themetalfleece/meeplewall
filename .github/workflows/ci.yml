name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Prettier in check mode. Without this the shared prettier config is
      # decorative and formatting drifts the first time someone forgets.
      - run: pnpm format
      # --if-present: a package participates in a gate only when it defines that
      # script. Phases add lint/typecheck/build/test scripts as their packages land.
      - run: pnpm -r --if-present lint
      - run: pnpm -r --if-present typecheck
      - run: pnpm -r --if-present build
      # The packages/db and apps/image-processor suites run against the compose Postgres, so CI
      # and local dev share one pinned image. Under CI they fail rather than skip when it is
      # unreachable.
      - run: docker compose -f infra/docker-compose.yml up -d --wait postgres
      # The storage round trip runs against the compose minio. A job `services:` entry cannot
      # pass minio its `server` command, so the job reuses the compose file and its pinned image.
      - run: docker compose -f infra/docker-compose.yml up -d --wait minio
      - run: docker compose -f infra/docker-compose.yml run --rm minio-init
      - run: pnpm -r --if-present test
        env:
          DATABASE_URL: postgres://boardgames:boardgames@localhost:5432/boardgames
          STORAGE_ENDPOINT: http://localhost:9000
          STORAGE_ACCESS_KEY_ID: minioadmin
          STORAGE_SECRET_ACCESS_KEY: minioadmin
          STORAGE_BUCKET: board-games
          STORAGE_PUBLIC_BASE_URL: http://localhost:9000/board-games
          STORAGE_FORCE_PATH_STYLE: 'true'
      # The worker image must keep building from a clean checkout.
      - run: docker build -f infra/Dockerfile.image-processor .
