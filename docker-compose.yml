# Local development infrastructure only. NOT a deployment artifact.
# Postgres is the app's cache/store; minio is a local stand-in for Cloudflare R2
# (S3-compatible API on :9000, web console on :9001).
#
#   docker compose up -d postgres minio minio-init
#
# Both services expose healthchecks so `up` reports `healthy` once ready.
# minio-init runs once, creates the public-read bucket, then exits.
name: meeplewall-dev

# Pulled from quay.io because MinIO's Docker Hub namespace no longer exists.
# This is the newest community image they published; later source releases
# have no container build.
x-minio-image: &minio-image quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z

services:
  postgres:
    image: postgres:17.11-trixie
    restart: unless-stopped
    environment:
      POSTGRES_USER: meeplewall
      POSTGRES_PASSWORD: meeplewall
      POSTGRES_DB: meeplewall
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U meeplewall -d meeplewall']
      interval: 5s
      timeout: 5s
      retries: 12

  minio:
    image: *minio-image
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD-SHELL', 'mc ready local || exit 1']
      interval: 5s
      timeout: 5s
      retries: 12

  # Creates the bucket the app uploads to and lets anyone read its objects, as
  # R2 does behind its public URL. Reuses the minio image for its bundled mc.
  minio-init:
    image: *minio-image
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ['/bin/sh', '-c']
    command:
      - >-
        mc alias set local http://minio:9000 minioadmin minioadmin &&
        mc mb --ignore-existing local/meeplewall &&
        mc anonymous set download local/meeplewall

volumes:
  postgres-data:
  minio-data:
