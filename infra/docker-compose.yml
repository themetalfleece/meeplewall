# Local development infrastructure only. NOT a deployment artifact.
# Postgres is the app's cache/store; minio is a local stand-in for Cloudflare R2
# (S3-compatible API on :9000, web console on :9001).
#
#   docker compose -f infra/docker-compose.yml up -d postgres minio
#
# Both services expose healthchecks so `up` reports `healthy` once ready.
name: board-games-dev

services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: boardgames
      POSTGRES_PASSWORD: boardgames
      POSTGRES_DB: boardgames
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U boardgames -d boardgames']
      interval: 5s
      timeout: 5s
      retries: 12

  minio:
    # Pulled from quay.io because MinIO's Docker Hub namespace no longer exists.
    # This is the newest community image they published; later source releases
    # have no container build.
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD-SHELL', 'mc ready local || exit 1']
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  postgres-data:
  minio-data:
