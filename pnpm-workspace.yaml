packages:
  - 'apps/*'
  - 'packages/*'

# Hardlink workspace dependencies into the consumer so their peers resolve
# through the host app instead of the package's own devDependency copy.
injectWorkspacePackages: true

# Third-party versions live here, never in a manifest. What each catalog means
# is in .agents/skills/package-management/SKILL.md. The frozen apps/web-legacy
# keeps its own ranges.
catalog:
  '@aws-sdk/client-s3': ^3.1152.0
  '@types/pg': ^8.23.1
  drizzle-orm: ^0.45.4
  pg: ^8.23.1
  react: ^19.3.1
  react-dom: ^19.3.1
  three: ^0.186.1
  zod: ^4.6.7

catalogs:
  dev:
    '@eslint/js': ^10.0.1
    '@types/node': ^26.6.5
    '@types/react': ^19.3.0
    '@types/react-dom': ^19.3.0
    '@types/three': ^0.186.0
    drizzle-kit: ^0.31.11
    eslint: ^10.13.0
    eslint-config-prettier: ^10.1.8
    jsdom: ^30.1.3
    prettier: ^3.9.6
    typescript: ^6.0.3
    typescript-eslint: ^8.65.0
    vite: ^8.3.4
    vitest: ^5.0.5
  peers:
    react: ^19.0.0

# Dependencies whose install/postinstall build scripts are allowed to run.
# esbuild fetches its platform binary (needed by Vite); sharp builds its
# libvips bindings for the image pipeline.
allowBuilds:
  esbuild: true
  sharp: true
