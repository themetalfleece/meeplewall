packages:
  - 'apps/*'
  - 'packages/*'

# Hardlink workspace dependencies into the consumer so their peers resolve
# through the host app instead of the package's own devDependency copy.
injectWorkspacePackages: true

# Third-party versions live here, never in a manifest. What each catalog means
# is in .agents/skills/package-management/SKILL.md.
catalog:
  '@aws-sdk/client-s3': ^3.1152.0
  '@tanstack/react-query': ^5.104.4
  '@types/pg': ^8.23.1
  clsx: ^2.1.1
  drizzle-orm: ^0.45.4
  fast-xml-parser: ^5.11.2
  next: ^16.4.2
  pg: ^8.23.1
  react: ^19.3.1
  react-dom: ^19.3.1
  sharp: ^0.35.5
  three: ^0.186.1
  zod: ^4.6.7

catalogs:
  dev:
    '@eslint/js': ^10.0.1
    '@playwright/test': ^1.64.1
    '@types/node': ^26.6.5
    '@types/react': ^19.3.0
    '@types/react-dom': ^19.3.0
    '@types/three': ^0.186.0
    drizzle-kit: ^0.31.11
    eslint: ^10.13.0
    eslint-config-prettier: ^10.1.8
    jsdom: ^30.1.3
    prettier: ^3.9.6
    typescript: ^6.0.3
    typescript-eslint: ^8.65.0
    vite: ^8.3.4
    vitest: ^5.0.5
  peers:
    react: ^19.0.0

# Dependencies whose install/postinstall build scripts are allowed to run.
# esbuild fetches its platform binary (needed by drizzle-kit); sharp builds its
# libvips bindings for the image pipeline.
allowBuilds:
  esbuild: true
  sharp: true

# Releases newer than pnpm's minimum release age, admitted because they were the latest stable
# when added.
minimumReleaseAgeExclude:
  - '@tanstack/query-core@5.104.4'
  - '@tanstack/react-query@5.104.4'
